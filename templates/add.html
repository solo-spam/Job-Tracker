{% extends "layout.html" %}
{% block body %}
<h3>Add Application</h3>

<form method="post">
    <div class="form-group">
        <label for="company">Company</label>
        <input type="text" id="company" name="company" placeholder="Company Name" required>
    </div>

    <div class="form-group">
        <label for="role">Role</label>
        <input type="text" id="role" name="role" placeholder="Job Role" required>
    </div>

    <div class="form-group">
        <label for="status">Status</label>
        <select id="status" name="status" required>
            <option value="Applied">Applied</option>
            <option value="Interview">Interview</option>
            <option value="Offer">Offer</option>
            <option value="Rejected">Rejected</option>
        </select>
    </div>

    <div class="form-group">
        <label for="applied_date">Applied Date</label>
        <input type="date" id="applied_date" name="applied_date" required>
    </div>

    <div class="form-group optional-notes">
        <label for="notes">Notes <span class="optional">(optional)</span></label>
        <textarea id="notes" name="notes" placeholder="Optional notes about the application" rows="4"></textarea>
    </div>

    <button type="submit">Add Application</button>
</form>
{% endblock %}
