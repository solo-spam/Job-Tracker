{% extends "layout.html" %}
{% block body %}
<h3>Login</h3>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}
<form method="post">
    <input 
        name="username" 
        placeholder="Username" 
        required 
        value="{{ request.form.username or '' }}"
    >
    <input 
        name="password" 
        type="password" 
        placeholder="Password" 
        required
    >
    <button type="submit">Login</button>
</form>
<p>
    <div class="auth-footer">
        Don't have an account? <a href="/register">Sign up</a>
    </div>
</p>
{% endblock %}
